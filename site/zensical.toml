# Zensical configuration for the development build.
# Paths are relative to build/, where the pipeline copies this file.
[project]
site_name = "Vector archive (development)"
site_description = "Rescued articles from Vector, the journal of the British APL Association"
site_url = "https://5jt.github.io/vector-rescue/"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
extra_css = ["assets/stylesheets/vector.css"]
# Home, the full index and the volumes; the pipeline replaces this line with one entry per volume
nav = [{ "Home" = "index.md" }]

[project.theme]
language = "en"
custom_dir = "overrides"
features = ["navigation.instant", "search.highlight"]
# The blue V of vector.org.uk (#66)
favicon = "assets/images/favicon.png"

# Only the extensions the converter's output needs. This replaces Zensical's
# defaults, several of which rewrite text that is common in articles about
# APL, J, K and q: smartsymbols (1/2 → ½, (r) → ®, -> → →), caret (^…^),
# tilde (~…~), mark (==…==), emoji (:name:), arithmatex ($…$), magiclink.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions."pymdownx.highlight"]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
guess_lang = false
[project.markdown_extensions."pymdownx.tabbed"]
# issues as tabs on the volume pages; slugs make each tab linkable (#68)
alternate_style = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
[project.markdown_extensions."pymdownx.superfences"]
