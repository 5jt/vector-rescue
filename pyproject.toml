[project]
name = "vecrescue"
version = "0.1.0"
description = "Rescue and republish the Vector journal archive"
requires-python = ">=3.12"
dependencies = [
    "lxml>=5",
    "PyYAML>=6",
    "zensical>=0.0.67",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
vecrescue = "vecrescue.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/vecrescue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
