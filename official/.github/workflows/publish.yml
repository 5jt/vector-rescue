# Build the site from docs/ with Zensical and publish it to GitHub Pages.
# Repository settings: Pages > Source must be "GitHub Actions".
name: Publish

# Run by hand (Actions > Publish > Run workflow) until Pages is enabled on
# VecEd/VectorArchive; then restore the push trigger:
#   push:
#     branches: [main]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install zensical==0.0.67
      - run: zensical build
      # The one step after Zensical: set each article's byline under its title
      - run: python scripts/lift_bylines.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
